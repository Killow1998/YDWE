name: YDWE Agent Native Checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  native-agent:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Python syntax checks
        shell: pwsh
        run: |
          python -m py_compile `
            Development\AI\ydagent_build_preflight.py `
            Development\AI\ydagent_live_regression.py `
            Development\AI\ydagent_tui.py

      - name: Native build preflight and focused build
        shell: pwsh
        run: |
          python Development\AI\ydagent_build_preflight.py --build-ydtrigger --build-tests

      - name: Native unit tests
        shell: pwsh
        run: |
          Build\bin\Debug\test\YDWE_Test.exe --reporter console --success

      - name: Upload native agent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ydagent-native-debug
          if-no-files-found: error
          path: |
            Development/Build/bin/Debug/plugin/YDTrigger.dll
            Development/Build/bin/Debug/plugin/YDTrigger.pdb
            Build/bin/Debug/test/YDWE_Test.exe
            Build/bin/Debug/test/YDWE_Test.pdb

      - name: Agent stub loopback
        shell: pwsh
        run: |
          if (Test-Path Development\Component\bin\lua.exe) {
            python Development\AI\ydagent_tui.py stub --port 27119
          } else {
            Write-Host "SKIP: Development\Component\bin\lua.exe is not produced by this focused native gate"
          }
